name: Community health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate community files
        run: python scripts/validate_community.py
      # Public repositories cannot call a private reusable workflow. Keep PR
      # validation here; the private application-workflows relay publishes main.
      - name: Validate public Xray feature identities
        run: python scripts/validate_xray.py
      - name: Run release digest tests
        run: python -m unittest discover -s tests -v
