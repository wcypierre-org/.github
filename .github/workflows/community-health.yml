name: Community health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate community files
        run: python scripts/validate_community.py
      - name: Run release digest tests
        run: python -m unittest discover -s tests -v
