name: Xray features

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'xray/acceptance/**'
      - '.github/workflows/xray-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  features:
    uses: wcypierre-org/application-workflows/.github/workflows/xray-features.yml@57cc922194080440f2792dbb056ded71744b5234
    with:
      feature_directory: xray/acceptance
      project_key: XRAY
      issue_fields_json: '{"customfield_10106":0}'
      publish: true
    secrets:
      XRAY_JIRA_TOKEN: ${{ secrets.XRAY_JIRA_TOKEN }}
