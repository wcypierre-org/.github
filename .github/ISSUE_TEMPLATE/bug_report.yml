name: Bug report
description: Report behavior that is broken, incorrect, or surprising.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for a maintainer to reproduce or reason about the issue.
  - type: input
    id: affected-area
    attributes:
      label: Affected repository or area
      description: Name the repository, component, script, workflow, or page involved.
      placeholder: "example: jira-server-api CI workflow"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "The workflow failed when..."
    validations:
      required: true
  - type: input
    id: deployed-version
    attributes:
      label: Version, commit, or deployment
      description: Identify the affected release, commit SHA, image tag, or deployment when known.
      placeholder: "example: main@abc1234 or v2.4.1"
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide commands, inputs, URLs, or actions that reproduce the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: reproduction-inputs
    attributes:
      label: Reproduction inputs
      description: Include the smallest sanitized configuration or input needed to reproduce the problem. Never include tokens, passwords, private keys, or personal data.
      render: text
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does the problem occur with the reproduction steps above?
      options:
        - Every time
        - Intermittently
        - Happened once
        - Unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or links
      description: Paste relevant output, screenshots, run URLs, or error messages. Remove tokens, passwords, private keys, cookies, personal data, and private URLs first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: redaction
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed secrets, credentials, cookies, personal data, and other private information from this report.
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, runtime, device, or other context when relevant.
      placeholder: "Windows 11, Node 26, Chrome..."
    validations:
      required: false
