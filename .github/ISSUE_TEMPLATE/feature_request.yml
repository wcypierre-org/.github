name: Feature request
description: Suggest a focused improvement or new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case first so the implementation can stay focused.
  - type: input
    id: affected-area
    attributes:
      label: Affected repository or area
      description: Name the repository, component, script, workflow, or page involved.
      placeholder: "example: tab-snooze import flow"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Explain how you handle the problem today and where that approach falls short.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often is this needed?
      options:
        - Daily
        - Weekly
        - Monthly
        - Occasionally
        - One-time migration or recovery
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Measurable success criteria
      description: Describe observable outcomes that would prove the problem is solved.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
